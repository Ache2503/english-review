{% extends "admin/base.html" %}
{% block title %}{{ 'Editar' if question else 'Nueva' }} Pregunta - Admin{% endblock %}

{% block admin_content %}
<h4 class="fw-bold mb-4">
    <i class="fas fa-edit"></i> {{ 'Editar' if question else 'Nueva' }} Pregunta
    <small class="text-muted">| {{ quiz.title }}</small>
</h4>

<div class="card" style="max-width: 700px;">
    <div class="card-body">
        <form method="POST" action="{{ action }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Pregunta (prompt)</label>
                    <textarea class="form-control" name="prompt" rows="3" required>{{ question.prompt if question else '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Orden</label>
                    <input type="number" class="form-control" name="order" value="{{ question.order if question else 0 }}">
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <label class="form-label w-100">Opcion correcta</label>
                    <select class="form-select" name="correct_option">
                        {% for i in range(1, 5) %}
                        <option value="{{ i }}" {% if existing_options and existing_options|length >= i and existing_options[i-1].is_correct %}selected{% endif %}>
                            Opcion {{ i }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                {% for i in range(1, 5) %}
                <div class="col-md-6">
                    <label class="form-label">Opcion {{ i }}</label>
                    <input type="text" class="form-control" name="option_{{ i }}"
                           value="{{ existing_options[i-1].text if existing_options and existing_options|length >= i else '' }}">
                </div>
                {% endfor %}
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                <a href="{{ url_for('admin.quiz_questions_list', quiz_id=quiz.id) }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
