{% extends 'base.html' %}

{% block title %}404 - Página No Encontrada{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-muted fw-bold">404</div>
    <h2 class="mt-3">Página No Encontrada</h2>
    <p class="text-muted lead">La página que buscas no existe o fue movida.</p>
    <div class="mt-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary me-2">
            <i class="fas fa-home me-1"></i> Volver al Inicio
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Volver Atrás
        </a>
    </div>
</div>
{% endblock %}
