<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Zone - Selecciona tu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{{ url_for('static', filename='css/modules/kids/kids.css') }}" rel="stylesheet">
</head>
<body class="kids-select-bg kids-body">

    <a href="{{ url_for('main.index') }}" class="btn btn-outline-light btn-exit rounded-pill px-4">
        <i class="fas fa-sign-out-alt"></i> Salir de Kids
    </a>

    <div class="text-center">
        <h1 class="display-3 fw-bold mb-5 text-warning">¿Quién está jugando hoy?</h1>
        
        <div class="d-flex justify-content-center gap-5 flex-wrap">
            {% for child in children %}
            <a href="{{ url_for('kids.learning_map', child_id=child.id) }}" class="text-decoration-none">
                <div class="profile-card text-center">
                    <div class="avatar-img d-flex align-items-center justify-content-center bg-white text-dark mx-auto">
                        <i class="fas fa-hippo fa-4x text-primary"></i>
                    </div>
                    <div class="profile-name fw-bold">{{ child.name }}</div>
                </div>
            </a>
            {% else %}
            <div class="alert alert-warning rounded-4 px-4 py-3">
                <h4>¡Ups! No hay pequeños registrados.</h4>
                <p>Pídele a tus papás que configuren tu perfil.</p>
            </div>
            {% endfor %}
            
            <div class="profile-card text-center" onclick="window.location.href='{{ url_for('kids.add_profile') }}'">
                <div class="avatar-img d-flex align-items-center justify-content-center bg-dark text-white mx-auto" style="border-style: dashed;">
                    <i class="fas fa-plus fa-3x"></i>
                </div>
                <div class="profile-name">Añadir Perfil</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
