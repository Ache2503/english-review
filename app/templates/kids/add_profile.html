<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Nuevo Explorador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/modules/kids/kids.css') }}" rel="stylesheet">
</head>
<body class="kids-form-bg kids-body d-flex align-items-center justify-content-center">
    <div class="card-kids text-center">
        <h2 class="mb-4 text-warning fw-bold">¡Nuevo Explorador!</h2>
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Nombre del niño/a:</label>
                <input type="text" name="name" class="form-control form-control-lg rounded-pill px-4" required placeholder="Ej: Sofía">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-bold">Edad:</label>
                <input type="number" name="age" class="form-control form-control-lg rounded-pill px-4" required min="3" max="14" placeholder="Ej: 7">
            </div>
            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold rounded-pill mb-3">
                ¡Crear Perfil!
            </button>
            <a href="{{ url_for('kids.select_profile') }}" class="btn btn-outline-light w-100 rounded-pill">
                Cancelar
            </a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
