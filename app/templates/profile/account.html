{% extends "base.html" %}

{% block title %}Configuración de Cuenta{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <h2 class="mb-4">Configuración de Cuenta</h2>
                    
                    <form method="POST">
                        <!-- Email -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Correo electrónico</label>
                            <input type="email" name="email" class="form-control" 
                                   value="{{ current_user.email }}">
                            <small class="text-muted">Este email se usará para iniciar sesión</small>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Cambiar contraseña -->
                        <h5 class="mb-3">Cambiar Contraseña</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Contraseña actual</label>
                            <input type="password" name="current_password" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="new_password" class="form-control">
                            <small class="text-muted">Mínimo 6 caracteres</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" name="confirm_password" class="form-control">
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill">
                                <i class="fas fa-save me-2"></i> Guardar Cambios
                            </button>
                            <a href="{{ url_for('profile.view') }}" class="btn btn-outline-secondary rounded-pill">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
