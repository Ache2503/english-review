{% extends 'base.html' %}

{% block title %}500 - Error del Servidor{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold">500</div>
    <h2 class="mt-3">Error del Servidor</h2>
    <p class="text-muted lead">Algo salió mal en nuestro servidor. Ya fue registrado el error.</p>
    <div class="mt-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary me-2">
            <i class="fas fa-home me-1"></i> Volver al Inicio
        </a>
        <a href="javascript:location.reload()" class="btn btn-outline-secondary">
            <i class="fas fa-redo me-1"></i> Reintentar
        </a>
    </div>
</div>
{% endblock %}
