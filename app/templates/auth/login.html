{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/modules/auth/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="fas fa-sign-in-alt"></i>
        </div>

        <h3>Iniciar Sesión</h3>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck">
                <label class="form-check-label" for="rememberCheck">Recordarme</label>
            </div>

            <button type="submit" class="btn btn-primary">
                Entrar
            </button>
        </form>

        <div class="auth-link">
            ¿No tienes cuenta?
            <a href="{{ url_for('auth.register') }}">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
