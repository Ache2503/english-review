{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/modules/auth/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="fas fa-user-plus"></i>
        </div>

        <h3>Crear Cuenta</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="Correo Electrónico" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirmar Contraseña" required>
            </div>

            <button type="submit" class="btn btn-success">
                Crear Cuenta
            </button>

        </form>

        <div class="auth-link">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('auth.login') }}">Inicia sesión aquí</a>
        </div>
    </div>
</div>
{% endblock %}
