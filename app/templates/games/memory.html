{% extends 'base.html' %}

{% block title %}Memory Match - Mini Juegos{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">
                        <i class="fas fa-brain me-2"></i>Memory Match
                    </h4>
                    <div>
                        <span id="moves-display" class="badge bg-light text-success me-2">Movimientos: 0</span>
                        <span id="timer-display" class="badge bg-light text-success">
                            <i class="fas fa-clock me-1"></i>00:00
                        </span>
                    </div>
                </div>
                <div class="card-body">
                    <div id="game-intro" class="text-center py-4">
                        <div class="display-4 mb-3">🧠</div>
                        <h3>Memory Match</h3>
                        <p class="text-muted">Encuentra los pares de palabras inglés-español</p>
                        <button id="start-btn" class="btn btn-success btn-lg">
                            <i class="fas fa-play me-2"></i>Comenzar
                        </button>
                    </div>
                    
                    <div id="game-board" class="d-none">
                        <div class="row g-3 justify-content-center" id="cards-container"></div>
                    </div>
                    
                    <div id="game-results" class="d-none text-center py-4">
                        <div class="display-1 mb-3">🎉</div>
                        <h2>¡Completado!</h2>
                        <div class="row justify-content-center g-3 my-4">
                            <div class="col-auto">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center px-4">
                                        <h3 class="mb-0" id="final-score">0</h3>
                                        <small>Puntos</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center px-4">
                                        <h3 class="mb-0" id="final-moves">0</h3>
                                        <small>Movimientos</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="card bg-info text-white">
                                    <div class="card-body text-center px-4">
                                        <h3 class="mb-0" id="final-time">00:00</h3>
                                        <small>Tiempo</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button onclick="location.reload()" class="btn btn-success me-2">
                                <i class="fas fa-redo me-1"></i>Jugar de nuevo
                            </button>
                            <a href="{{ url_for('games.game_list') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-th me-1"></i>Otros juegos
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.memory-card {
    width: 120px;
    height: 80px;
    cursor: pointer;
    perspective: 1000px;
}
.memory-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}
.memory-card.flipped .memory-card-inner {
    transform: rotateY(180deg);
}
.memory-card-front, .memory-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: bold;
}
.memory-card-front {
    background: linear-gradient(135deg, #198754, #20c997);
    color: white;
    font-size: 1.5rem;
}
.memory-card-back {
    background: white;
    border: 2px solid #198754;
    transform: rotateY(180deg);
    padding: 5px;
    font-size: 0.9rem;
    text-align: center;
}
.memory-card.matched {
    opacity: 0.6;
    pointer-events: none;
}
</style>

<script>
const level = '{{ level }}';
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let startTime = null;
let timerInterval = null;
let isLocked = false;

document.getElementById('start-btn').addEventListener('click', startGame);

async function startGame() {
    const response = await fetch(`/games/memory/get-cards?level=${level}&pairs=8`);
    const data = await response.json();
    cards = data.cards;
    
    document.getElementById('game-intro').classList.add('d-none');
    document.getElementById('game-board').classList.remove('d-none');
    
    renderCards();
    startTime = Date.now();
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const seconds = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerHTML = 
            `<i class="fas fa-clock me-1"></i>${minutes}:${seconds}`;
    }, 1000);
}

function renderCards() {
    const container = document.getElementById('cards-container');
    container.innerHTML = '';
    
    cards.forEach((card, index) => {
        const cardHtml = `
            <div class="col-auto">
                <div class="memory-card" data-index="${index}" data-pair="${card.pair_id}" onclick="flipCard(this)">
                    <div class="memory-card-inner">
                        <div class="memory-card-front">?</div>
                        <div class="memory-card-back">${card.content}</div>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += cardHtml;
    });
}

function flipCard(cardElement) {
    if (isLocked) return;
    if (cardElement.classList.contains('flipped')) return;
    if (cardElement.classList.contains('matched')) return;
    if (flippedCards.length >= 2) return;
    
    cardElement.classList.add('flipped');
    flippedCards.push(cardElement);
    
    if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves-display').textContent = `Movimientos: ${moves}`;
        checkMatch();
    }
}

function checkMatch() {
    isLocked = true;
    const [card1, card2] = flippedCards;
    const pair1 = card1.dataset.pair;
    const pair2 = card2.dataset.pair;
    
    if (pair1 === pair2) {
        // Match!
        setTimeout(() => {
            card1.classList.add('matched');
            card2.classList.add('matched');
            matchedPairs++;
            flippedCards = [];
            isLocked = false;
            
            if (matchedPairs === cards.length / 2) {
                endGame();
            }
        }, 500);
    } else {
        // No match
        setTimeout(() => {
            card1.classList.remove('flipped');
            card2.classList.remove('flipped');
            flippedCards = [];
            isLocked = false;
        }, 1000);
    }
}

async function endGame() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    
    // Calculate score (fewer moves = higher score)
    const baseScore = 100;
    const movesPenalty = Math.max(0, moves - 8) * 2;
    const timePenalty = Math.floor(elapsed / 10);
    const score = Math.max(0, baseScore - movesPenalty - timePenalty);
    
    // Save score
    await fetch('/games/memory/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            score: score,
            level: level,
            time_seconds: elapsed
        })
    });
    
    // Show results
    document.getElementById('game-board').classList.add('d-none');
    document.getElementById('game-results').classList.remove('d-none');
    
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-moves').textContent = moves;
    
    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const seconds = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('final-time').textContent = `${minutes}:${seconds}`;
}
</script>
{% endblock %}
