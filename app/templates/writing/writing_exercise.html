{% extends "base.html" %}

{% block title %}Ejercicio de Escritura{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <a href="{{ url_for('units.view_writing_practices', unit_id=practice.unit_id) }}" class="btn btn-sm btn-outline-secondary mb-3">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <h1>
            <i class="fas fa-pencil-alt"></i> {{ practice.title }}
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Instrucciones</h5>
                <p class="card-text">{{ practice.instructions }}</p>
                <div class="alert alert-info">
                    <i class="fas fa-lightbulb"></i> <strong>Ejemplo:</strong>
                    <div class="mt-2">{{ practice.example_text }}</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Tu Texto</h5>
                <form method="POST">
                    <div class="mb-3">
                        <textarea name="text" rows="10" class="form-control" placeholder="Escribe aquí...">{{ previous_submission.text if previous_submission else '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
