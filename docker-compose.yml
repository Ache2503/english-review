version: '3.8'

services:
  english-review:
    build: .
    container_name: english-review-production
    restart: always
    ports:
      - "5100:5100"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./logs:/app/logs
    networks:
      - english-review-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  english-review-network:
    driver: bridge
